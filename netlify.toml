[build]
  # Temporarily serving the static site from public/ while the Next.js
  # deploy is fixed. The /tools app is kept in the repo but not deployed.
  command = "echo static"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # Next.js 16 needs Node 20.9+.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true
