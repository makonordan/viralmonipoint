[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  # Next.js 16 needs Node 20.9+.
  NODE_VERSION = "22"

# The Netlify Next.js adapter serves the Next.js build (pages, rewrites,
# static files from public/). Without it the .next folder is served raw.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true
